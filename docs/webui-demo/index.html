<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; media-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>会议库 · Open Meeting Memo 演示</title>
  <script src="theme.js"></script>
  <script src="sidebar.js"></script>
  <link rel="stylesheet" href="palette.css">
  <link rel="stylesheet" href="styles.css">
  <script src="demo-data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a class="brand" href="#library" aria-label="Open Meeting Memo 会议库"><span class="brand-mark"><svg class="brand-wordmark" viewBox="0 0 46 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path data-letter="o" d="M7 6.5h1.5L11 9v4.5c0 2.2-1.8 4-4 4s-4-1.8-4-4v-3c0-2.2 1.8-4 4-4Z"/><path data-letter="m" d="M15 17.5v-10 M15 10.5c0-4.8 6-4.8 6 0v7 M21 10.5c0-4.8 6-4.8 6 0v7"/><path data-letter="m" d="M31 17.5v-10 M31 10.5c0-4.8 6-4.8 6 0v7 M37 10.5c0-4.8 6-4.8 6 0v7"/></svg></span><strong>Open Meeting Memo<small>把讨论，变成下一步。</small></strong></a>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true" data-sidebar-tip="收起侧栏"><svg class="nav-icon" data-icon="collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path class="toggle-direction" d="m15 9-3 3 3 3"/></svg><span class="sidebar-toggle-label">收起侧栏</span></button>
    </div>
    <div class="workspace-label">个人工作空间 <span>LOCAL</span></div>
    <nav aria-label="主要导航">
      <a href="#library" data-nav="library" data-sidebar-tip="会议库" aria-label="会议库"><svg class="nav-icon" data-icon="library" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5.5C9 3.5 6 3.5 3 4.5v15c3-1 6-1 9 1 3-2 6-2 9-1v-15c-3-1-6-1-9 1Z M12 5.5v15 M6 8h3 M15 8h3 M6 11h3 M15 11h3"/></svg><span class="nav-label">会议库</span> <span class="nav-count" id="library-count"></span></a>
      <a href="#queue" data-nav="queue" data-sidebar-tip="处理队列" aria-label="处理队列"><svg class="nav-icon" data-icon="queue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7.5h.01 M11 7.5h6 M7 12h.01 M11 12h6 M7 16.5h.01 M11 16.5h6"/></svg><span class="nav-label">处理队列</span> <span class="nav-count" id="queue-count"></span></a>
      <div class="nav-section">偏好与支持</div>
      <a href="#settings" data-nav="settings" data-sidebar-tip="设置" aria-label="设置"><svg class="nav-icon" data-icon="settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2.3"/><path d="M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.6 5.6l2.1 2.1 M16.3 16.3l2.1 2.1 M5.6 18.4l2.1-2.1 M16.3 7.7l2.1-2.1"/></svg><span class="nav-label">设置</span></a>
      <a href="#diagnostics" data-nav="diagnostics" data-sidebar-tip="状态与诊断" aria-label="状态与诊断"><svg class="nav-icon" data-icon="diagnostics" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M6 12h3l2-4 3 8 2-4h2"/></svg><span class="nav-label">状态与诊断</span></a>
      <a href="#help" data-nav="help" data-sidebar-tip="使用帮助" aria-label="使用帮助"><svg class="nav-icon" data-icon="help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .2c0 1.8-2.5 1.8-2.5 3.8 M12 16.5h.01"/></svg><span class="nav-label">使用帮助</span></a>
    </nav>
    <div class="sidebar-foot">
      <a class="sidebar-status" href="#diagnostics" data-sidebar-tip="静态演示 · 未连接服务" aria-label="静态演示 · 未连接服务"><svg class="nav-icon" data-icon="status" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg><span class="sidebar-status-label">静态演示 · 未连接服务</span></a>
      <p>仅使用虚构会议。<br>所有操作只改变演示状态。</p>
      <button class="text-button sidebar-reset" data-action="reset" data-sidebar-tip="恢复演示数据" aria-label="恢复演示数据"><svg class="nav-icon" data-icon="reset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 10a9 9 0 1 1 2 8 M3 4v6h6"/></svg><span class="sidebar-reset-label">恢复演示数据</span></button>
    </div>
  </aside>
  <div class="shell">
    <header class="topbar"><span id="breadcrumb">工作空间 / 会议库</span><div><span class="demo-pill">交互预览</span><span class="top-hint">离线 · 不录音 · 不调用模型</span><label class="theme-picker" for="theme-preference">外观<select id="theme-preference" aria-label="外观主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label></div></header>
    <div class="sidebar-warning" id="sidebar-warning" role="status" hidden></div>
    <div class="theme-warning" id="theme-warning" role="status" hidden></div>
    <div class="storage-warning" id="storage-warning" role="status" hidden>浏览器无法保存演示状态；本次操作仍可体验，关闭页面后将恢复初始数据。</div>
    <main id="main" tabindex="-1"></main>
    <footer class="page-footer">Open Meeting Memo <span>本地 WebUI 设计预览 / 所有会议内容均为虚构</span></footer>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div class="sidebar-tooltip" id="sidebar-tooltip" role="tooltip" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
