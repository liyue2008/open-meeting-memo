[package]
name = "omm-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
build = "build.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]
native-bridge-fixture = ["dep:objc2", "dep:block2"]

[lib]
name = "omm_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "omm-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
rfd = { version = "=0.17.2", default-features = false }
arboard = { version = "=3.6.1", default-features = false }
tauri = { version = "=2.12.4", default-features = false, features = ["wry", "compression"] }
omm = { package = "open-meeting-memo", path = "../../.." }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# Used only by the explicit, nonpersistent WK fixture's owned-view snapshot callback.
objc2 = { version = "=0.6.5", optional = true }
block2 = { version = "=0.6.2", optional = true }
