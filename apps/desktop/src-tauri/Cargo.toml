[package]
name = "omm-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
build = "build.rs"

[lib]
name = "omm_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "omm-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", default-features = false, features = ["wry", "compression"] }
omm = { package = "open-meeting-memo", path = "../../.." }
