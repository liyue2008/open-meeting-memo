[package]
name = "open-meeting-memo"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
default-run = "omm"

[lib]
name = "omm"
path = "src/lib.rs"

[[bin]]
name = "omm"
path = "src/main.rs"

[[bin]]
name = "omm-asr-worker"
path = "src/bin/asr_worker.rs"
required-features = ["asr"]

[features]
default = ["capture", "asr"]
capture = []
asr = []

[dependencies]
chrono-tz = "=0.10.4"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
async-trait = "0.1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
libc = "0.2"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tar = "0.4"
bzip2 = "0.4"
hound = "3"
libloading = "0.8"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["apps/desktop/src-tauri"]
default-members = ["."]
resolver = "2"
